<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>AMORA – Elegance & Style | Premium Fashion & Lifestyle</title>

    <meta
      name="description"
      content="Shop premium fashion, shoes, bags, electronics, beauty, sports and lifestyle products at AMORA. Discover quality products, modern style and a seamless online shopping experience."
    />

    <meta
      name="keywords"
      content="AMORA, online shopping, fashion, shoes, bags, electronics, beauty products, sports products, lifestyle products, Pakistan"
    />

    <meta name="author" content="AMORA – Elegance & Style" />

    <!-- Search Engine Instructions -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <!-- Canonical URL -->
    <!-- IMPORTANT: Replace with your real website domain after deployment -->
    <link
      rel="canonical"
      href="https://YOUR-DOMAIN.com/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/Image/Logo.png"
    />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="AMORA – Elegance & Style | Premium Fashion & Lifestyle"
    />

    <meta
      property="og:description"
      content="Discover premium fashion, shoes, bags, electronics and lifestyle products at AMORA."
    />

    <meta
      property="og:image"
      content="https://YOUR-DOMAIN.com/Image/Logo.png"
    />

    <meta
      property="og:url"
      content="https://YOUR-DOMAIN.com/"
    />

    <meta
      property="og:site_name"
      content="AMORA – Elegance & Style"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="AMORA – Elegance & Style | Premium Fashion & Lifestyle"
    />

    <meta
      name="twitter:description"
      content="Shop quality fashion, footwear, bags, electronics and lifestyle products at AMORA."
    />

    <meta
      name="twitter:image"
      content="https://YOUR-DOMAIN.com/Image/Logo.png"
    />

    <!-- Theme Color -->
    <meta
      name="theme-color"
      content="#071a3a"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
